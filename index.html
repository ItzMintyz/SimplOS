<!DOCTYPE html>
<html lang="en">
<head>
<title>CSS Template</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  margin: 0;
  min-height: 100vh;
  position: relative;
}

/* Style the header */
header {
  background-color: #666;
  padding: 10px;
  text-align: center;
  font-size: 35px;
  color: white;
}

.wrapper {
  position: absolute;
  left: 120px;
  top: 120px;
  width: 260px;
  background: white;
  z-index: 10;
}

.wrapper header {
  background: #444;
  color: white;
  padding: 10px 12px;
  font-size: 18px;
  cursor: grab;
  user-select: none;
}

.wrapper header.active {
  cursor: grabbing;
}

.wrapper .content {
  padding: 16px;
  background: #f7f7f7;
}

#currentTime {
  font-size: 18px;
  margin-top: 8px;
  color: #fff;
}

/* Create two columns/boxes that floats next to each other */
nav {
  float: left;
  width: 10%;
  height: 500px; /* only for demonstration, should be removed */
  background: #ccc;
  padding: 20px;
}

/* Style the list inside the menu */
nav ul {
  list-style-type: none;
  padding: 0;
}

article {
  float: left;
  padding: 20px;
  width: 90%;
  background-color: #f1f1f1;
  height: 500px; /* only for demonstration, should be removed */
}

/* Clear floats after the columns */
section::after {
  content: "";
  display: table;
  clear: both;
}

/* Responsive layout - makes the two columns/boxes stack on top of each other instead of next to each other, on small screens */
@media (max-width: 600px) {
  nav, article {
    width: 100%;
    height: auto;
  }
}
</style>
</head>
<body>

<header>
  <div id="currentTime" aria-live="polite"></div>
</header>

<div class="wrapper">
  <header>Generic Window</header>
  <div class="content">This box can be dragged around the page.</div>
</div>

<section>
  <nav>
    <ul>
      <li><a href="#">google</a></li>
      <li><a href="#">Visual Studio</a></li>
      <li><a href="#">Settings</a></li>
    </ul>
  </nav>
  
  <article>
 
  </article>
</section>

<script>
  const timeDisplay = document.getElementById("currentTime");

  function updateTime() {
    const now = new Date();
    timeDisplay.textContent = now.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
  }

  updateTime();
  setInterval(updateTime, 1000);
</script>

<script src="draggable-div-in-javascript/script.js"></script>

</body>
</html>
