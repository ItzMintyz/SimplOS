<!DOCTYPE html>
<html lang="en">
<head>
<title>CSS Template</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  margin: 0;
  min-height: 100vh;
  position: relative;
}

body.dark {
  background: #222;
  color: #eee;
}

body.dark article {
  background: #333;
}

body.wallpaper-blue {
  background: #d9e6f2;
}

body.wallpaper-green {
  background: #dce8dc;
}

body.dark .wrapper .content {
  background: #ddd;
  color: #111;
}

/* Style the header */
header {
  background-color: #666;
  padding: 10px;
  text-align: center;
  font-size: 35px;
  color: white;
}

.wrapper {
  position: absolute;
  left: 120px;
  top: 120px;
  width: 260px;
  min-width: 220px;
  min-height: 100px;
  background: white;
  z-index: 10;
  border: 1px solid #444;
  resize: both;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.wrapper.browser-window {
  width: 560px;
  height: 420px;
  max-width: calc(100vw - 20px);
  max-height: calc(100vh - 20px);
}

.wrapper header {
  background: #444;
  color: white;
  padding: 10px 12px;
  font-size: 18px;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.window-title {
  cursor: grab;
  flex: 1;
}

.window-title:focus {
  outline: 1px dotted #fff;
  outline-offset: 2px;
}

.window-controls {
  display: flex;
  gap: 4px;
}

.window-controls button {
  border: 1px solid #aaa;
  background: #666;
  color: white;
  min-width: 24px;
  height: 22px;
  padding: 0 5px;
  cursor: pointer;
}

.window-controls button:hover,
.window-controls button:focus {
  background: #888;
}

.window-controls button:focus {
  outline: 1px dotted #fff;
  outline-offset: 1px;
}

.wrapper header.active .window-title {
  cursor: grabbing;
}

.wrapper .content {
  padding: 16px;
  background: #f7f7f7;
  flex: 1;
  min-height: 0;
  min-width: 0;
  overflow: auto;
}

.browser-content {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  height: auto;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}

.browser-toolbar {
  display: flex;
  gap: 6px;
}

.browser-toolbar input {
  min-width: 0;
  flex: 1;
}

.browser-toolbar button {
  padding: 2px 8px;
}

.browser-frame {
  width: 100%;
  min-height: 0;
  min-width: 0;
  flex: 1;
  display: block;
  border: 1px solid #888;
  background: #fff;
}

.browser-fallback {
  flex: 0 0 auto;
  margin: 0;
  font-size: 12px;
}

.app-form {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.app-form textarea {
  min-height: 180px;
  resize: vertical;
}

.notes-name {
  width: 100%;
}

.notes-actions {
  display: flex;
  gap: 6px;
}

.file-manager {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.file-manager-list {
  margin: 0;
  padding-left: 20px;
}

.file-manager-list button {
  margin-left: 6px;
}

.calculator {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.calculator input {
  width: 100%;
  text-align: right;
}

.calculator-keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}

.file-list {
  margin: 0;
  padding-left: 20px;
}

.settings-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.settings-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

#currentTime {
  font-size: 18px;
  margin-top: 8px;
  color: #fff;
}

/* Create two columns/boxes that floats next to each other */
nav {
  float: left;
  width: 10%;
  min-height: calc(100vh - 58px);
  background: #ccc;
  padding: 20px;
}

nav ul {
  list-style-type: none;
  padding: 0;
}

nav button {
  border: 0;
  background: transparent;
  color: #0000ee;
  padding: 0;
  cursor: pointer;
  font: inherit;
  text-decoration: underline;
}

.start-menu {
  position: fixed;
  left: 20px;
  top: 90px;
  width: 180px;
  padding: 12px;
  background: #ccc;
  border: 1px solid #444;
  z-index: 30;
}

.start-menu[hidden] {
  display: none;
}

.start-menu h2 {
  margin: 0 0 10px;
  font-size: 16px;
  font-weight: normal;
}

.start-menu ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

.start-menu li + li {
  margin-top: 8px;
}

.start-menu button {
  display: block;
  width: 100%;
  text-align: left;
}

article {
  float: left;
  padding: 20px;
  width: 90%;
  min-height: calc(100vh - 58px);
  background-color: transparent;
}

/* Clear floats after the columns */
section::after {
  content: "";
  display: table;
  clear: both;
}

/* Responsive layout - makes the two columns/boxes stack on top of each other instead of next to each other, on small screens */
@media (max-width: 600px) {
  article {
    height: auto;
  }
}
</style>
</head>
<body>

<header>
  <div id="currentTime" aria-live="polite"></div>
</header>

<div class="wrapper" id="generic-window" data-app="Generic Window">
  <header>
    <span class="window-title" tabindex="0">Generic Window</span>
    <div class="window-controls" aria-label="Window controls">
      <button type="button" data-action="minimize" aria-label="Minimize window">_</button>
      <button type="button" data-action="reset" aria-label="Reset window position">R</button>
      <button type="button" data-action="close" aria-label="Close window">X</button>
    </div>
  </header>
  <div class="content">This box can be dragged around the page.</div>
</div>

<section>
  <nav>
    <ul>
      <li><button type="button" class="start-button" aria-expanded="false" aria-controls="start-menu">Start</button></li>
      <li id="taskbar-windows"><button type="button" class="taskbar-window" data-window-id="generic-window" aria-pressed="true">Generic Window</button></li>
    </ul>
  </nav>
  <div class="start-menu" id="start-menu" hidden>
    <h2>Applications</h2>
    <ul>
      <li><button type="button" data-app="File Manager">File Manager</button></li>
      <li><button type="button" data-app="Web Browser">Web Browser</button></li>
      <li><button type="button" data-app="Settings">Settings</button></li>
      <li><button type="button" data-app="Notes">Notes</button></li>
      <li><button type="button" data-app="Calculator">Calculator</button></li>
      <li><button type="button" data-app="About SimplOS">About SimplOS</button></li>
    </ul>
  </div>
  
  <article>
 
  </article>
</section>

<script>
  const timeDisplay = document.getElementById("currentTime");

  function updateTime() {
    const now = new Date();
    timeDisplay.textContent = now.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
  }

  updateTime();
  setInterval(updateTime, 1000);
</script>

<script src="script.js"></script>

</body>
</html>
