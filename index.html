<!DOCTYPE html>
<html lang="en">
<head>
<title>CSS Template</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  margin: 0;
  min-height: 100vh;
  position: relative;
}

/* Style the header */
header {
  background-color: #666;
  padding: 10px;
  text-align: center;
  font-size: 35px;
  color: white;
}

.wrapper {
  position: absolute;
  left: 120px;
  top: 120px;
  width: 260px;
  background: white;
  z-index: 10;
  border: 1px solid #444;
}

.wrapper header {
  background: #444;
  color: white;
  padding: 10px 12px;
  font-size: 18px;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.window-title {
  cursor: grab;
  flex: 1;
}

.window-title:focus {
  outline: 1px dotted #fff;
  outline-offset: 2px;
}

.window-controls {
  display: flex;
  gap: 4px;
}

.window-controls button {
  border: 1px solid #aaa;
  background: #666;
  color: white;
  min-width: 24px;
  height: 22px;
  padding: 0 5px;
  cursor: pointer;
}

.window-controls button:hover,
.window-controls button:focus {
  background: #888;
}

.window-controls button:focus {
  outline: 1px dotted #fff;
  outline-offset: 1px;
}

.wrapper header.active .window-title {
  cursor: grabbing;
}

.wrapper .content {
  padding: 16px;
  background: #f7f7f7;
}

#currentTime {
  font-size: 18px;
  margin-top: 8px;
  color: #fff;
}

/* Create two columns/boxes that floats next to each other */
nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  min-height: 48px;
  background: #ccc;
  border-top: 1px solid #666;
  padding: 6px 10px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
}

nav ul {
  display: flex;
  align-items: center;
  gap: 6px;
  list-style-type: none;
  padding: 0;
  margin: 0;
}

nav button {
  border: 1px solid #888;
  background: #eee;
  color: #222;
  min-height: 30px;
  padding: 4px 10px;
  cursor: pointer;
}

nav button:hover,
nav button:focus {
  background: #fff;
}

nav button:focus {
  outline: 1px dotted #222;
  outline-offset: 1px;
}

.taskbar-window[aria-pressed="true"] {
  background: #aaa;
}

article {
  padding: 20px;
  width: 100%;
  background-color: #f1f1f1;
  height: 500px; /* only for demonstration, should be removed */
}

/* Clear floats after the columns */
section::after {
  content: "";
  display: table;
  clear: both;
}

/* Responsive layout - makes the two columns/boxes stack on top of each other instead of next to each other, on small screens */
@media (max-width: 600px) {
  article {
    height: auto;
  }
}
</style>
</head>
<body>

<header>
  <div id="currentTime" aria-live="polite"></div>
</header>

<div class="wrapper">
  <header>
    <span class="window-title" tabindex="0">Generic Window</span>
    <div class="window-controls" aria-label="Window controls">
      <button type="button" data-action="minimize" aria-label="Minimize window">_</button>
      <button type="button" data-action="reset" aria-label="Reset window position">R</button>
      <button type="button" data-action="close" aria-label="Close window">X</button>
    </div>
  </header>
  <div class="content">This box can be dragged around the page.</div>
</div>

<section>
  <nav>
    <ul>
      <li><button type="button" class="start-button">Start</button></li>
      <li><button type="button" class="taskbar-window" aria-pressed="true">Generic Window</button></li>
    </ul>
  </nav>
  
  <article>
 
  </article>
</section>

<script>
  const timeDisplay = document.getElementById("currentTime");

  function updateTime() {
    const now = new Date();
    timeDisplay.textContent = now.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
  }

  updateTime();
  setInterval(updateTime, 1000);
</script>

<script src="script.js"></script>

</body>
</html>
